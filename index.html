<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophetic Timeline | Jejak Para Nabi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Palette: Desert Night & Royal Gold */
            --bg-gradient-1: #0f2027;
            --bg-gradient-2: #203a43;
            --bg-gradient-3: #2c5364;
            
            --gold-primary: #D4AF37;
            --gold-light: #f3e5ab;
            --text-light: #f8fafc;
            
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #141E30, #243B55, #1e130c, #2C5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- DECORATION --- */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        /* --- CONTAINER & HEADER --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 48px;
            background: linear-gradient(to right, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* --- TIMELINE STRUCTURE --- */
        .timeline {
            position: relative;
            margin: 0 auto;
        }

        /* Garis Tengah */
        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background: linear-gradient(to bottom, transparent, var(--gold-primary), transparent);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
            border-radius: 2px;
            box-shadow: 0 0 15px var(--gold-primary);
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            opacity: 0; /* Hidden initially for animation */
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Posisi Kiri & Kanan */
        .left { left: 0; text-align: right; }
        .right { left: 50%; text-align: left; }

        /* Dot (Titik) di Garis */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            right: -10px;
            background-color: var(--bg-gradient-1);
            border: 3px solid var(--gold-primary);
            top: 25px; /* Sesuaikan dengan posisi card */
            border-radius: 50%;
            z-index: 1;
            box-shadow: 0 0 10px var(--gold-primary);
            transition: 0.3s;
        }
        
        .right::after { left: -10px; }
        
        .timeline-item:hover::after {
            background-color: var(--gold-primary);
            transform: scale(1.3);
        }

        /* --- CARD STYLE --- */
        .content-card {
            padding: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            position: relative;
            transition: 0.4s;
            box-shadow: var(--glass-shadow);
        }

        .content-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--gold-primary);
        }

        /* Nomor Urut */
        .prophet-number {
            position: absolute;
            top: -15px;
            font-family: 'Cinzel', serif;
            font-size: 40px;
            color: rgba(255,255,255,0.05);
            font-weight: 700;
            z-index: 0;
        }
        .left .prophet-number { right: 20px; }
        .right .prophet-number { left: 20px; }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: var(--gold-primary);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .card-snippet {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 15px;
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }

        .btn-detail {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-detail:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px var(--gold-primary);
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-box {
            background: linear-gradient(135deg, #1e2532, #141821);
            width: 90%; max-width: 600px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 40px;
            position: relative;
            transform: scale(0.9);
            transition: 0.3s;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
        }
        .modal-title { font-family: 'Cinzel'; font-size: 28px; color: var(--gold-primary); }
        .close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        .modal-info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;
        }
        .info-item { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; }
        .info-label { font-size: 10px; text-transform: uppercase; color: var(--gold-primary); display: block; }
        .info-val { font-size: 14px; }

        /* --- RESPONSIVE MOBILE --- */
        @media screen and (max-width: 768px) {
            .timeline::after { left: 31px; }
            
            .timeline-item { width: 100%; padding-left: 70px; padding-right: 25px; }
            
            .timeline-item::after { left: 21px; }
            
            .left::after, .right::after { left: 21px; }
            
            .left, .right { left: 0%; text-align: left; }

            .prophet-number { right: 20px; left: auto !important; }
            
            .title { font-size: 32px; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }
        /* =========================================
           RESPONSIVE MOBILE DESIGN (TAMPILAN HP)
           ========================================= */
        @media screen and (max-width: 768px) {
            
            /* 1. CONTAINER & HEADER */
            .container {
                padding: 30px 15px; /* Kurangi padding pinggir */
            }
            
            .title {
                font-size: 32px; /* Judul lebih kecil agar muat */
                line-height: 1.2;
            }
            
            .subtitle {
                font-size: 14px;
                padding: 0 10px;
            }

            /* 2. GARIS TENGAH (PINDAH KE KIRI) */
            /* Di HP, garis tidak di tengah, tapi di sisi kiri */
            .timeline::after {
                left: 31px; 
            }

            /* 3. ITEM KARTU (RESET POSISI) */
            /* Ubah dari 50% menjadi 100% lebar layar */
            .timeline-item {
                width: 100%;
                padding-left: 75px; /* Beri jarak untuk garis di kiri */
                padding-right: 15px;
                margin-bottom: 20px;
            }

            /* Hapus efek zig-zag (kiri/kanan) */
            .left, .right {
                left: 0%;
                text-align: left; /* Semua teks rata kiri */
            }

            /* 4. TITIK (DOT) EMAS */
            /* Pastikan titik semua nabi lurus di garis kiri */
            .timeline-item::after {
                left: 21px; 
                top: 30px; /* Sesuaikan tinggi titik */
            }
            
            /* Paksa item kanan (genap) untuk ikut ke kiri */
            .right::after {
                left: 21px; 
            }

            /* 5. NOMOR URUT NABI (BACKGROUND) */
            /* Pindahkan semua nomor ke pojok kanan atas kartu */
            .prophet-number {
                font-size: 36px;
                right: 20px !important; 
                left: auto !important; /* Reset posisi left */
                top: -10px;
            }

            /* 6. MODAL POPUP (DETAIL KISAH) */
            .modal-box {
                width: 95%; /* Lebar hampir full layar */
                padding: 25px; /* Padding lebih kecil */
                max-height: 85vh; /* Agar tidak kepotong di layar kecil */
                margin-top: 20px;
            }

            .modal-title {
                font-size: 22px; /* Judul modal lebih kecil */
            }

            .modal-header {
                padding-bottom: 10px;
                margin-bottom: 15px;
            }

            /* Info grid (Gelar & Tempat) jadi 1 kolom ke bawah */
            .modal-info-grid {
                grid-template-columns: 1fr; 
                gap: 10px;
            }

            .info-item {
                padding: 8px;
            }
            
            /* Tombol Close lebih besar agar mudah disentuh jari */
            .close-btn {
                font-size: 28px;
                padding: 5px;
            }
        }

    </style>
</head>

        // --- RENDER LOGIC ---
        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = ''; // Bersihkan container

            prophetsData.forEach((prophet, index) => {
                // Tentukan posisi zig-zag
                const positionClass = (index % 2 === 0) ? 'left' : 'right';
                
                const item = document.createElement('div');
                item.className = `timeline-item ${positionClass}`;
                
                // Render Kartu Preview
                item.innerHTML = `
                    <div class="content-card">
                        <div class="prophet-number">${prophet.id}</div>
                        <h3 class="card-title">${prophet.name}</h3>
                        <p class="card-snippet">
                            <i class="fa-solid fa-location-dot" style="margin-right:5px; color:var(--gold-primary);"></i> ${prophet.place}<br>
                            <span style="display:block; margin-top:5px; color:#fff;">Event: ${prophet.event}</span>
                        </p>
                        <button class="btn-detail" onclick="openModal(${prophet.id})">Lihat Kisah Lengkap</button>
                    </div>
                `;
                
                container.appendChild(item);
            });
            
            setupObserver();
        }

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.timeline-item').forEach(item => {
                observer.observe(item);
            });
        }
        // --- MODAL LOGIC ---
        const modal = document.getElementById('detailModal');
        
     
        
        function openModal(id) {
            const data = prophetsData.find(p => p.id === id);
            
            if(data) {
                // 1. Isi Header Modal
                document.getElementById('mName').innerText = data.name;
                document.getElementById('mTitle').innerText = data.title || "-";
                document.getElementById('mPlace').innerText = data.place;
                document.getElementById('mLesson').innerText = data.lesson || "Hikmah sedang dimuat...";

                // 2. Render 12 Kejadian (Looping)
                const descContainer = document.getElementById('mDesc');
                descContainer.innerHTML = ""; // Bersihkan isi lama

                // Cek apakah data timeline detail tersedia
                if (data.timeline && data.timeline.length > 0) {
                    data.timeline.forEach(event => {
                        // Buat Wrapper per Kejadian
                        const eventDiv = document.createElement('div');
                        eventDiv.style.marginBottom = "30px";
                        eventDiv.style.borderBottom = "1px solid rgba(255,255,255,0.1)";
                        eventDiv.style.paddingBottom = "20px";

                        // Judul Kejadian
                        const titleH4 = document.createElement('h4');
                        titleH4.innerText = event.title;
                        titleH4.style.color = "var(--gold-primary)";
                        titleH4.style.fontFamily = "'Cinzel', serif";
                        titleH4.style.marginBottom = "15px";
                        titleH4.style.fontSize = "18px";
                        eventDiv.appendChild(titleH4);

                        // Paragraf (Looping Content)
                        event.content.forEach(paragraph => {
                            const p = document.createElement('p');
                            p.innerText = paragraph;
                            p.style.marginBottom = "15px";
                            p.style.lineHeight = "1.8";
                            p.style.color = "rgba(255,255,255,0.9)";
                            p.style.textAlign = "justify";
                            eventDiv.appendChild(p);
                        });

                        descContainer.appendChild(eventDiv);
                    });
                } else {
                    descContainer.innerHTML = "<p><em>Data detail sejarah untuk Nabi ini belum ditambahkan. Silakan hubungi admin untuk update selanjutnya.</em></p>";
                }
                
                modal.classList.add('active');
            }
        }
        function closeModal() {
            modal.classList.remove('active');
        }

        // Close on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // --- INIT ---
        renderTimeline();

    </script>
